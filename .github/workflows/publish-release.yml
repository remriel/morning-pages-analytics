name: Publish Morning Pages Analytics release

on:
  push:
    tags:
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morning-pages-analytics-release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test and build plugin
        run: |
          node --test
          node scripts/build.cjs
          node --check main.js
          test -s main.js
          node -e 'const m=require("./manifest.json"),p=require("./package.json");if(!/^\d+\.\d+\.\d+$/.test(m.version)||m.version!==p.version)process.exit(1)'
          VERSION=$(node -p 'require("./manifest.json").version')
          if [[ "${GITHUB_REF_TYPE}" == tag && "${GITHUB_REF_NAME}" != "${VERSION}" ]]; then
            echo "The release tag must match the plugin manifest version."
            exit 1
          fi

      - name: Package installation ZIP
        run: |
          VERSION=$(node -p 'require("./manifest.json").version')
          mkdir -p dist/morning-pages-analytics
          cp main.js manifest.json styles.css dist/morning-pages-analytics/
          cp LICENSE dist/
          cd dist
          zip -q "morning-pages-analytics-${VERSION}.zip" morning-pages-analytics/main.js morning-pages-analytics/manifest.json morning-pages-analytics/styles.css LICENSE

      - name: Publish Obsidian release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p 'require("./manifest.json").version')
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists."
            exit 0
          fi
          gh release create "${VERSION}" main.js manifest.json styles.css LICENSE assets/screenshots/writing-stats.png assets/screenshots/writing-history.png assets/github-banner.png assets/github-banner.svg "dist/morning-pages-analytics-${VERSION}.zip" \
            --target "${GITHUB_SHA}" \
            --title "Morning Pages Analytics ${VERSION}" \
            --notes "$(cat <<EOF
          Make the patterns in your daily notes easier to see.

          Morning Pages Analytics is an open-source Obsidian plugin for local writing stats and automatic Daily Notes history.

          **For a note:** See word count, writing cues, mindset balances, pronouns, senses and a word cloud.

          **Over time:** Browse word trends, category mix, goal streaks and a writing calendar. Filter by 7, 30, 90 or 365 days, all dates, or a custom range. Inspect individual days and compare each period with the one before it.

          Examples shown here use synthetic writing. The language charts count English word cues and are most useful for exploring patterns across notes.

          ![Writing stats view](https://raw.githubusercontent.com/remriel/morning-pages-analytics/main/assets/screenshots/writing-stats.png)

          ![Daily writing history](https://raw.githubusercontent.com/remriel/morning-pages-analytics/main/assets/screenshots/writing-history.png)

          ![Morning Pages Analytics banner](https://raw.githubusercontent.com/remriel/morning-pages-analytics/main/assets/github-banner.png)

          Released under the [MIT License](https://github.com/remriel/morning-pages-analytics/releases/download/${VERSION}/LICENSE).
          EOF
          )"
