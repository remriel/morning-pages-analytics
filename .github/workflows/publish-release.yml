name: Publish Morning Pages Analytics release

on:
  push:
    tags:
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: morning-pages-analytics-release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test and build plugin
        env:
          MPA_REQUIRE_BROWSER: "1"
        run: |
          npm ci
          npm test
          npm run build
          node --check main.js
          test -s main.js
          node -e 'const m=require("./manifest.json"),p=require("./package.json");if(!/^\d+\.\d+\.\d+$/.test(m.version)||m.version!==p.version)process.exit(1)'
          VERSION=$(node -p 'require("./manifest.json").version')
          test -s "docs/RELEASE_NOTES_${VERSION}.md"
          if [[ "${GITHUB_REF_TYPE}" == tag && "${GITHUB_REF_NAME}" != "${VERSION}" ]]; then
            echo "The release tag must match the plugin manifest version."
            exit 1
          fi

      - name: Package installation ZIP
        run: |
          VERSION=$(node -p 'require("./manifest.json").version')
          mkdir -p dist/morning-pages-analytics
          cp main.js manifest.json styles.css dist/morning-pages-analytics/
          cp LICENSE dist/
          cd dist
          zip -q "morning-pages-analytics-${VERSION}.zip" morning-pages-analytics/main.js morning-pages-analytics/manifest.json morning-pages-analytics/styles.css LICENSE

      - name: Attest downloadable assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
            LICENSE
            assets/screenshots/writing-stats.png
            assets/screenshots/writing-history.png
            assets/github-banner.png
            assets/github-banner.svg
            dist/*.zip

      - name: Publish Obsidian release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p 'require("./manifest.json").version')
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists."
            exit 0
          fi
          gh release create "${VERSION}" main.js manifest.json styles.css LICENSE assets/screenshots/writing-stats.png assets/screenshots/writing-history.png assets/github-banner.png assets/github-banner.svg "dist/morning-pages-analytics-${VERSION}.zip" \
            --target "${GITHUB_SHA}" \
            --title "Morning Pages Analytics ${VERSION}" \
            --notes-file "docs/RELEASE_NOTES_${VERSION}.md"
